<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>任务面板</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    button {
      margin: 5px;
      padding: 8px 12px;
      background-color: #4285f4;
      color: white;
      border: none;

  <h2>任务面板</h2>

</html>
